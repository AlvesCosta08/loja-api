services:
  # 1. Seu serviço Spring Boot (Web Service)
  - type: web
    name: loja-api
    runtime: docker
    repo: https://github.com/AlvesCosta08/loja-api
    branch: main
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "3600000"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://loja-web.vercel.app"
      # ★ Conectar ao banco PostgreSQL na mesma rede privada
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://loja-postgres:5432/loja  # "loja-postgres" é o nome do Private Service abaixo
      - key: SPRING_DATASOURCE_USERNAME
        value: loja_user
      - key: SPRING_DATASOURCE_PASSWORD
        value: sua_senha_forte_aqui

  # 2. Banco PostgreSQL auto-hospedado (Private Service)
  - type: pserv
    name: loja-postgres
    runtime: docker
    image:
      url: docker.io/library/postgres:16  # Usar imagem oficial do PostgreSQL
    plan: starter
    envVars:
      - key: POSTGRES_DB
        value: loja
      - key: POSTGRES_USER
        value: loja_user
      - key: POSTGRES_PASSWORD
        value: sua_senha_forte_aqui
    disk:
      name: pg-data
      mountPath: /var/lib/postgresql/data
      sizeGB: 10
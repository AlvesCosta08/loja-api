services:
  - type: web
    name: loja-api
    runtime: docker
    repo: https://github.com/AlvesCosta08/loja-api
    branch: main
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=75.0 -XX:+UseSerialGC"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "3600000"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://loja-web.vercel.app"
  
      - key: SPRING_DATASOURCE_URL
        sync: false         
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: loja-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: loja-db
          property: password
    
      - key: REDIS_URL
        fromService:
          type: redis
          name: loja-redis
          property: connectionString

databases:
  - name: loja-db
    databaseName: loja
    user: loja_user
    plan: starter
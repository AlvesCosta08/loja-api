databases:
  - name: loja-postgres
    plan: free
    region: oregon
    databaseName: loja
    user: loja
    postgresMajorVersion: "16"

services:
  - type: redis
    name: loja-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: loja-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: loja-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: loja-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: loja-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: loja-postgres
          property: user
      - key: DB_PASS
        fromDatabase:
          name: loja-postgres
          property: password
      - key: DB_SSLMODE
        value: require
      - key: REDIS_HOST
        fromService:
          type: redis
          name: loja-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: loja-redis
          property: port
      - key: REDIS_PASSWORD
        fromService:
          type: redis
          name: loja-redis
          property: password
      - key: REDIS_SSL
        value: "false"                # ← CORRIGIDO (Redis interno Render = sem TLS)
      - key: JWT_SECRET
        generateValue: true           # ou sync: false + defina no painel
      - key: JWT_EXPIRATION_MS
        value: "3600000"
      # - key: SERVER_PORT             # ← REMOVIDO (Render injeta PORT)
      #   value: "8080"
      - key: CORS_ALLOWED_ORIGINS
        value: https://loja-web.onrender.com
      # - key: SPRING_PROFILES_ACTIVE  # ← REMOVIDO (sem application-prod.yml)
      #   value: prod
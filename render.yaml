databases:
  - name: loja-postgres
    plan: free
    region: oregon
    databaseName: loja
    user: loja
    postgresMajorVersion: "16"

services:
  - type: keyvalue
    name: loja-redis
    plan: free
    region: oregon
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: loja-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health/liveness
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=70"

      # PostgreSQL
      - key: DB_HOST
        fromDatabase:
          name: loja-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: loja-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: loja-postgres
          property: database
      - key: DB_USER
        fromDatabase:
          name: loja-postgres
          property: user
      - key: DB_PASS
        fromDatabase:
          name: loja-postgres
          property: password
      - key: DB_SSLMODE
        value: require

      # Redis (uma única URL)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: loja-redis
          property: connectionString

      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: "3600000"

      # CORS
      - key: CORS_ALLOWED_ORIGINS
        value: https://loja-web.onrender.com
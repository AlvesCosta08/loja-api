spring:
  datasource:
    url: jdbc:h2:mem:loja-${random.uuid};MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: false
  cache:
    type: simple

jwt:
  secret: test-secret-with-at-least-32-characters-for-h2-tests
  expiration-ms: 3600000

cors:
  allowed-origins: http://localhost:5173

server:
  port: 0

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  health:
    redis:
      enabled: false
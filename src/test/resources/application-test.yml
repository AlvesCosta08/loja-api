spring:
  datasource:
    url: jdbc:h2:mem:loja_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-with-at-least-32-chars-ok
  expiration-ms: 3600000

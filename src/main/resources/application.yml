spring:
  datasource:
    # O Render fornece a URL no formato: postgres://usuario:senha@host:porta/banco
    # O Spring Boot 3 converte isso automaticamente para jdbc:postgresql://...
    url: ${DATABASE_URL}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  # O Render injeta a variável PORT dinamicamente (ex: 10000)
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  health:
    redis:
      enabled: false

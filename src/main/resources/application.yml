spring:
  application:
    name: loja-api
  datasource:
    url: jdbc:postgresql://localhost:5432/loja
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:change-me-in-production-with-at-least-32-chars}
  expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics

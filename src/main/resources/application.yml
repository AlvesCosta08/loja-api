spring:
  datasource:
    # Adiciona 'jdbc:' antes da variável. 
    # Ex: se DATABASE_URL for 'postgres://...', vira 'jdbc:postgres://...'
    url: jdbc:${DATABASE_URL}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  health:
    redis:
      enabled: false

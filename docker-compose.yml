services:

  postgres:
    image: postgres:16
    container_name: loja-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-loja}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASS:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - loja-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-loja}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: loja-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - loja-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

networks:
  loja-net:
    driver: bridge

volumes:
  pg_data:

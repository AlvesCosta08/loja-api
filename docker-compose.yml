services:

  postgres:
    image: postgres:16
    container_name: loja-postgres
    environment:
      POSTGRES_DB: loja_db
      POSTGRES_USER: app
      POSTGRES_PASSWORD: Caf74@08
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - loja-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d loja_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  loja-api:
    image: loja-api-test
    container_name: loja-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/loja_db
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: Caf74@08
    ports:
      - "8080:8080"
    networks:
      - loja-net
    depends_on:
      postgres:
        condition: service_healthy

networks:
  loja-net:
    driver: bridge

volumes:
  pg_data: